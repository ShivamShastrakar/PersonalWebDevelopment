# AWS Configuration
aws.region=ap-south-1

# Spring Cloud AWS Configuration
spring.cloud.aws.region.static=ap-south-1
spring.cloud.aws.credentials.access-key=${aws.accessKeyId:}
spring.cloud.aws.credentials.secret-key=${aws.secretAccessKey:}

# SQS Configuration (controlled per environment)
# Credentials are provided via system properties:
#   -Daws.accessKeyId=
#   -Daws.secretAccessKey=
#   -Daws.accountId=

# Default SQS Configuration (when no profile specified)
# disable auto creation globally
#For temporary disable SQS for local testing without AWS credentials
spring.cloud.aws.sqs.enabled=false
spring.cloud.aws.sqs.queue-auto-create=false

# listener specific
spring.cloud.aws.sqs.listener.auto-startup=true
spring.cloud.aws.sqs.listener.queue-creation-strategy=never
spring.cloud.aws.sqs.listener.queue-not-found-strategy=fail


# SQS Queue URLs (default to dev environment when no profile specified)
app.aws.sqs.exam-queue=https://sqs.ap-south-1.amazonaws.com/${aws.accountId:805472282650}/mahaexam-exam-queue

springdoc.swagger-ui.path=/swagger-ui.html

cors.allowed-origins=http://localhost:4201


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=sqs-consumer-

# OpenAI Configuration
openai.model=gpt-4o
openai.maxCompletionTokens=16384

# ?? OpenAI Rate Limiter ????????????????????????????????????????????????????????
# Max requests per minute (OpenAI tier limit). Controls min inter-request gap.
openai.rateLimit.rpm=500
# Max simultaneous in-flight requests (prevents bursts even within RPM budget).
openai.rateLimit.maxConcurrent=5
# Initial back-off wait (ms) after first 429 response.
openai.rateLimit.initialBackoffMs=500
# Maximum back-off wait (ms) ? doubles on each 429 up to this ceiling.
openai.rateLimit.maxBackoffMs=60000
# Maximum number of 429-triggered retries before giving up.
openai.rateLimit.maxRetries=5
openai.maxRetries=3
openai.mcqBatchSize=10
openai.paragraphBatchSize=10


question.image.s3.bucket=dev-mahaexam-question-images

