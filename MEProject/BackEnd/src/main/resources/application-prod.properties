# Database
#AWS Dev
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.url: jdbc:mysql://localhost:3306/mahaexam?zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username: root
spring.datasource.password: Rootpwd@1234

spring.mail.from=info@mahaexam.org.in
cors.allowed-origins=https://mahaexam.org.in,http://mahaexam.org.in

# Spring Cloud AWS SQS Configuration for PROD
# Credentials are provided via system properties: -Daws.accessKeyId= -Daws.secretAccessKey= -Daws.accountId=
# Queue created manually: mahaexam-exam-prod-queue
spring.cloud.aws.sqs.enabled=true
spring.cloud.aws.sqs.endpoint=https://sqs.ap-south-1.amazonaws.com
spring.cloud.aws.sqs.listener.queue-not-found-strategy=fail
spring.cloud.aws.sqs.listener.queue-creation-strategy=never
spring.cloud.aws.sqs.listener.auto-startup=false


app.aws.sqs.exam-queue=https://sqs.ap-south-1.amazonaws.com/${aws.accountId:805472282650}/mahaexam-exam-prod-queue
question.image.s3.bucket=prod-mahaexam-question-images
